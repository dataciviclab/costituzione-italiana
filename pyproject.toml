[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-costituzione-italiana"
version = "0.1.0"
description = "Costituzione italiana — testo, revisioni, Corte Costituzionale e citazioni"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# Runtime per test, script di import e contratti SQL.
# toolkit è CLI esterno → extra `pipeline`; lab-connectors da toolkit (transitiva).
dependencies = [
    "duckdb>=1.5.3,<2",
    "pyarrow>=14",
    "PyYAML>=6",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Streamlit Cloud legge dashboard/requirements.txt (export pin dello stesso extra).
dashboard = [
    "streamlit>=1.61",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/costituzione-italiana"
