[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costituzione-italiana"
version = "0.1.0"
description = "Costituzione della Repubblica Italiana — testo strutturato in Markdown"
license = "CC-BY-SA-3.0"
requires-python = ">=3.11"
dependencies = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
    "duckdb>=1.5.3",
    "pyarrow>=14",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[tool.setuptools]
packages = []
