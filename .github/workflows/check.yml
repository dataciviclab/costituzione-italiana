name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          install-extras: "dev,pipeline"
        timeout-minutes: 8
      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "tests/ dashboard/tests/"
          mypy_paths: ""
          test_dir: "tests dashboard/tests"
          pytest_args: "-v --tb=short"

  detect:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      count: ${{ steps.detect.outputs.count }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/detect-changed-datasets@main
        id: detect
        with:
          paths: "datasets compose"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-config:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.found == 'true'
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -e '.[dev,pipeline]'"
      configs: ${{ needs.detect.outputs.dirs }}
      years: "from-config"
