name: Pipeline

on:
  # Push su main, non `pull_request: closed`: il merge della PR di registry
  # (bot, `post-merge-registry/*`) rientrava nel filtro `paths` per via del
  # three-dot diff e ri-triggerava la pipeline → loop. Con `push` il merge del
  # registry tocca solo `registry/**` e non matcha.
  push:
    branches: [main]
    paths:
      - "datasets/**"
      - "compose/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Anni (es. 2026 o all)"
        required: false
        default: ""

concurrency:
  group: costituzione-italiana-pipeline
  cancel-in-progress: false

env:
  TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"

jobs:
  pipeline:
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "costituzione-italiana"
      # Sempre run completo: niente detect-paths/run-batch-command (selettività
      # post-merge non usata — schedule mensile + post-merge riallineano tutto).
      run-command: "make run-all"
      install-extras: "dev,pipeline"
      extra-env: "TOOLKIT_ALLOW_SCRIPT_SOURCE=1"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
