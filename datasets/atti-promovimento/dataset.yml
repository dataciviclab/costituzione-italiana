root: "../../out"
schema_version: 1

dataset:
  name: "atti_promovimento_corte_costituzionale"
  source_id: "corte_costituzionale"
  tags: [costituzione, giurisprudenza, corte_costituzionale, promovimento]
  category: giustizia
  description: >
    Atti di promovimento PENDENTI davanti alla Corte costituzionale:
    parametri costituzionali evocati dalle ordinanze, dai ricorsi e dai
    ricorsi per conflitto tra enti/poteri ancora in attesa di decisione.
    È uno snapshot, non una serie storica: la fonte open data pubblica
    solo i registri dei giudizi pendenti (oggi 2024–2026).
  years: [2026]
  time_coverage:
    start_year: 2024
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "atti_promovimento_xml"
      type: "script"
      args:
        command: "python3 ../scripts/importa-corte-costituzionale.py --output-dir ."
        output: "atti-promovimento.parquet"
        filename: "atti-promovimento.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - tipo
    - anno
    - numero_atto
    - numero_parte
    - parametro_articolo
    - parametro_comma
    - norma_descrizione
    - norma_numero
    - norma_articolo
    - norme_str
    - n_norme
  validate:
    # Soglia anti-download-parziale, non un atteso di prodotto: la fonte
    # (`Norme_impugnate`, quattro registri) ha **1.000** parametri Costituzione
    # oggi (794 ordinanze + 191 ricorsi + 11 conflitti enti + 4 conflitti
    # poteri). Se salta un registro il conteggio scende sotto 900, quindi la
    # soglia resta una guardia reale.
    min_rows: 900
    not_null:
      - anno
      - parametro_articolo
    # una riga per atto × parte × parametro × comma (dedup dei 7 duplicati
    # identici della fonte)
    primary_key: [tipo, anno, numero_atto, numero_parte, parametro_articolo, parametro_comma]

mart:
  tables:
    - name: "mart_parametri_per_annuale"
      sql: "sql/mart/mart_parametri_per_annuale.sql"
    - name: "mart_tipi_giudizio_per_annuale"
      sql: "sql/mart/mart_tipi_giudizio_per_annuale.sql"
  required_tables:
    - "mart_parametri_per_annuale"
    - "mart_tipi_giudizio_per_annuale"
  validate:
    table_rules:
      mart_parametri_per_annuale:
        primary_key: [anno, parametro_articolo]
        min_rows: 50
      mart_tipi_giudizio_per_annuale:
        primary_key: [anno, tipo]
        min_rows: 3

validation:
  fail_on_error: true
