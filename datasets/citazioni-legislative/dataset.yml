root: "../../out"
schema_version: 1

dataset:
  name: "citazioni_costituzionali"
  source_id: "italia_corpus"
  tags: [costituzione, legislazione, citazioni]
  category: normativa
  years: [2026]

# Clean pubblicata di italia-corpus `riferimenti`: le citazioni costituzionali
# sono archi con `origine='costituzione'` e `bersaglio_id='costituzione:art:N'`
# (fold 2026-11). Niente più derived da GitHub raw: un solo canale (GCS).
raw:
  output_policy: overwrite
  sources:
    - name: "citazioni_riferimenti"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/italia-corpus/riferimenti/2026/riferimenti_2026_clean.parquet"
        filename: "riferimenti_2026_clean.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - fonte_filename
    - fonte_collezione
    - fonte_anno
    - fonte_tipo
    - articolo
    - contesto
    - peso
  validate:
    min_rows: 5000
    not_null:
      - fonte_filename
      - articolo
    primary_key: [fonte_filename, articolo]

mart:
  tables:
    - name: "mart_citazioni_per_articolo"
      sql: "sql/mart/mart_citazioni_per_articolo.sql"
  required_tables:
    - "mart_citazioni_per_articolo"
  validate:
    table_rules:
      mart_citazioni_per_articolo:
        primary_key: [articolo]
        min_rows: 50

validation:
  fail_on_error: true
