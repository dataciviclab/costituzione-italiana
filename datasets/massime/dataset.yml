root: "../../out"
schema_version: 1

dataset:
  name: "massime_corte_costituzionale"
  source_id: "corte_costituzionale"
  tags: [costituzione, giurisprudenza, corte_costituzionale, massime]
  category: giurisprudenza
  years: [2026]
  time_coverage:
    start_year: 1956
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "massime_xml"
      type: "script"
      args:
        command: "python3 ../scripts/importa-massime.py --output-dir ."
        output: "massime.parquet"
        filename: "massime.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns:
    - id_massima
    - anno_pronuncia
    - numero_pronuncia
    - tipologia_pronuncia
    - tipologia_giudizio
    - data_decisione
    - data_deposito
    - esito
    - titolo
    - testo
    - parametri
    - norme
    - n_parametri
    - n_norme
  validate:
    min_rows: 40000
    not_null:
      - id_massima
      - anno_pronuncia
      - numero_pronuncia
    # id_massima è l'id globale della massima (unico in tutta la serie)
    primary_key: [id_massima]

mart:
  tables:
    - name: "mart_sentenze_per_annuale"
      sql: "sql/mart/mart_sentenze_per_annuale.sql"
    - name: "mart_parametri_per_annuale"
      sql: "sql/mart/mart_parametri_per_annuale.sql"
    - name: "mart_esiti_per_giudizio"
      sql: "sql/mart/mart_esiti_per_giudizio.sql"
    - name: "mart_massime_parametri"
      sql: "sql/mart/mart_massime_parametri.sql"
    - name: "mart_massime_norme"
      sql: "sql/mart/mart_massime_norme.sql"
  required_tables:
    - "mart_sentenze_per_annuale"
    - "mart_parametri_per_annuale"
    - "mart_esiti_per_giudizio"
    - "mart_massime_parametri"
    - "mart_massime_norme"
  validate:
    table_rules:
      mart_sentenze_per_annuale:
        primary_key: [anno_pronuncia]
        min_rows: 50
      mart_parametri_per_annuale:
        primary_key: [anno_pronuncia, parametro_articolo]
        min_rows: 500
      mart_esiti_per_giudizio:
        primary_key: [tipologia_giudizio]
        min_rows: 5
      mart_massime_parametri:
        min_rows: 80000
      mart_massime_norme:
        min_rows: 60000

validation:
  fail_on_error: true
